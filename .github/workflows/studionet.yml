name: VerdictMesh Studionet Proof

on:
  push:
    paths:
      - "contracts/**"
      - "tests/integration/**"
      - "requirements.txt"
      - "fixtures/**"
      - ".github/workflows/studionet.yml"
  workflow_dispatch:

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pin contract source hash
        run: sha256sum contracts/verdict_mesh.py
      - name: Run canonical bonded dispute lifecycle
        run: gltest tests/integration/test_verdictmesh_studionet.py -v -s --network studionet
